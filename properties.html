<!doctype html>
<html lang="am" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trusted Brokerage | Properties</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html" class="brand-text">Trusted Broker</a>
      </div>
      <button class="hamburger" id="hamburger-menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-links">
        <a href="index.html">መነሻ</a>
        <a href="properties.html">ቤቶች</a>
        <a href="cars.html">መኪኖች</a>
        <a href="land.html">መሬት</a>
        <a href="about.html">ስለ እኛ</a>
        <a href="contact.html">ያነጋግሩን</a>
        <a href="dashboard.html">ዳሽቦርድ</a>
        <a href="auth.html" class="btn-nav">ግባ / ተመዝገብ</a>
      </nav>
      <button id="theme-toggle" class="theme-btn">🌙</button>
    </header>

    <section class="container section-padding">
      <h2>የቤቶች ዝርዝር እና ካርታ</h2>

      <div class="filter-controls">
        <input
          type="text"
          id="propertySearch"
          placeholder="በቦታ ወይም በስም ይፈልጉ (ምሳሌ፡ ቦሌ...)"
        />
        <div class="view-toggles">
          <button id="btn-grid-view" class="btn-toggle active">
            Grid View
          </button>
          <button id="btn-map-view" class="btn-toggle">Map View</button>
        </div>
      </div>

      <div id="properties-grid" class="grid" style="margin-top: 25px">
        <div class="card property-item">
          <img src="./images/villa.jpg" alt="Villa" />
          <div class="card-body">
            <span class="badge">ለሽያጭ</span>
            <h3>ዘመናዊ ቪላ (ቦሌ)</h3>
            <p class="price">15,000,000 ብር</p>
            <p>4 መኝታ ቤት | 3 መታጠቢያ</p>
          </div>
        </div>
        <div class="card property-item">
          <img src="./images/apartama.jpg" alt="Apartment" />
          <div class="card-body">
            <span class="badge">ለኪራይ</span>
            <h3>አፓርታማ (CMC)</h3>
            <p class="price">7,500,000 ብር</p>
            <p>2 መኝታ ቤት | 2 መታጠቢያ</p>
          </div>
        </div>
      </div>

      <div
        id="map-container"
        style="
          height: 450px;
          display: none;
          margin-top: 25px;
          border-radius: 12px;
          overflow: hidden;
        "
      ></div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="main-script.js"></script>
  </body>
</html>
