<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trusted Brokerage | Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo"><a href="index.html" class="brand-text">Trusted Broker</a></div>
    <button class="hamburger" id="hamburger-menu"><span></span><span></span><span></span></button>
    <nav id="nav-links">
      <a href="index.html">መነሻ</a>
      <a href="properties.html">ቤቶች</a>
      <a href="cars.html">መኪኖች</a>
      <a href="land.html">መሬት</a>
      <a href="about.html">ስለ እኛ</a>
      <a href="contact.html" class="active">ያነጋግሩን</a>
    </nav>
    <button id="theme-toggle" class="theme-btn">🌙</button>
  </header>

  <section class="container section-padding">
    <h2>ያነጋግሩን (Contact Us)</h2>

    <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top: 20px;">
      <form style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; display: flex; flex-direction: column; gap: 15px;">
        <h3>መልእክት ይላኩ</h3>
        <input type="text" placeholder="ስም" required style="padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px;" />
        <input type="email" placeholder="ኢሜይል" required style="padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px;" />
        <textarea placeholder="መልእክትዎ..." rows="5" required style="padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px;"></textarea>
        <button type="submit" class="btn-primary">ላክ</button>
      </form>

      <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px;">
        <h3>የአድራሻ መረጃ</h3>
        <p style="margin-top: 15px;"><strong>አድራሻ:</strong> አዲስ አበባ፣ ኢትዮጵያ (ቦሌ)</p>
        <p><strong>ስልክ:</strong> +251 911 00 00 00</p>
        <p><strong>ኢሜይል:</strong> contact@trustedbroker.com</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Trusted Brokerage. All rights reserved.</p>
    </div>
  </footer>

  <script src="main-script.js"></script>
</body>
</html>
