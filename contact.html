      <button id="theme-toggle" class="theme-btn">🌙</button>
    </header>

    <section class="container section-padding">
      <h2>ያነጋግሩን (Contact Us)</h2>

      <div
        class="grid"
        style="grid-template-columns: 1fr 1fr; margin-top: 20px"
      >
        <form
          style="
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
          "
        >
          <h3>መልእክት ይላኩ</h3>
          <input
            type="text"
            placeholder="ስም"
            required
            style="
              padding: 0.8rem;
              border: 1px solid var(--border-color);
              border-radius: 6px;
            "
          />
          <input
            type="email"
            placeholder="ኢሜይል"
            required
            style="
              padding: 0.8rem;
              border: 1px solid var(--border-color);
              border-radius: 6px;
            "
          />
          <textarea
            placeholder="መልእክትዎ..."
            rows="5"
            required
            style="
              padding: 0.8rem;
              border: 1px solid var(--border-color);
              border-radius: 6px;
            "
          ></textarea>
          <button type="submit" class="btn-primary">ላክ</button>
        </form>

        <div
          style="
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
          "
        >
          <h3>የአድራሻ መረጃ</h3>
          <p style="margin-top: 15px">
            <strong>አድራሻ:</strong> አዲስ አበባ፣ ኢትዮጵያ (ቦሌ)
          </p>
          <p><strong>ስልክ:</strong> +251 911 00 00 00</p>
          <p><strong>ኢሜይል:</strong> contact@trustedbroker.com</p>
        </div>
      </div>
    </section>
